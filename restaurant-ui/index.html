<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Restaurant UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<div id="toast" class="toast"></div>
<body>
<div class="container">
    <div class="sidebar">
        <h2>🍽 MoonWalk</h2>
        <button onclick="setActive(this); showMenu()">View Menu</button>
        <button onclick="setActive(this); showPending()">View Order Status</button>
    </div>
    <div class="main">
        <div class="topbar">
            <h2 id="pageTitle">View Menu</h2>
            <div class="cart" onclick="openCart()">
                🛒 <span id="cartCount">0</span>
            </div>
        </div>
        <div id="content"></div>
    </div>
</div>
<script src="menu.js"></script>
<script src="cart.js"></script>
<script src="order.js"></script>
<script src="app.js"></script>
</body>
</html>
